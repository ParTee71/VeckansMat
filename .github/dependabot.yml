version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for all minor and patch updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types follow the Node major in .nvmrc, which is bumped deliberately.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'Beroenden'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The workflows use the actions together, so they are updated together.
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'Actions'
