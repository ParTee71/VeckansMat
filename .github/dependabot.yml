version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for all minor and patch updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'Beroenden'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'Actions'
